name: Bug report
description: Report unexpected RelayCheck behavior
body:
  - type: input
    id: environment
    attributes:
      label: RelayCheck version and operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic data. Report vulnerabilities through Security advisories.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
