name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: relaycheck-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  CARGO_TERM_COLOR: always
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build the embedded frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Run the native suite and build the release executable
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
          cargo test --locked
          cargo build --release --locked
          python scripts/dependency_notices.py target/THIRD-PARTY-LICENSES.txt
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Verify the production Web UI
        run: python scripts/run_ui_gates.py "target/release/relaycheck${{ runner.os == 'Windows' && '.exe' || '' }}" target/ui-gates.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relaycheck-${{ runner.os }}
          path: |
            target/release/relaycheck${{ runner.os == 'Windows' && '.exe' || '' }}
            target/ui-gates.json
            target/THIRD-PARTY-LICENSES.txt
            LICENSE
            NOTICE
          if-no-files-found: error
